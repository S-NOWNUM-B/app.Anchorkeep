include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - build/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - android/**
    - ios/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    # Импорты только через package:, без относительных
    - always_use_package_imports
    - require_trailing_commas
    - prefer_single_quotes
    - prefer_final_locals
    - unawaited_futures
    # print запрещён: секреты не должны утекать в логи
    - avoid_print
