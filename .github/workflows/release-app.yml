name: release-app

# Релизные сборки для демо и защиты: APK для Android и zip для Windows.
# Запуск вручную из вкладки Actions (workflow_dispatch) или по тегу v*.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

defaults:
  run:
    working-directory: app

jobs:
  release-android:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: anchorkeep-android-release
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          if-no-files-found: error

  release-windows:
    timeout-minutes: 30
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Собрать zip приложения
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath anchorkeep-windows-release.zip
      - uses: actions/upload-artifact@v4
        with:
          name: anchorkeep-windows-release
          path: app/anchorkeep-windows-release.zip
          retention-days: 30
          if-no-files-found: error
