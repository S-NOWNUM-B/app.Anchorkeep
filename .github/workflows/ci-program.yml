name: ci-program

on:
  # На каждом PR: сводная проверка обязательна для мержа в main (MAIN-23),
  # тяжёлые job сами пропускаются, если область не менялась.
  pull_request:
  push:
    branches: [main]
    paths: ["program/**", ".github/workflows/ci-program.yml"]

concurrency:
  group: ci-program-${{ github.ref }}
  cancel-in-progress: true

env:
  SOLANA_VERSION: 4.1.2
  ANCHOR_VERSION: 1.2.1

defaults:
  run:
    working-directory: program

permissions:
  contents: read

jobs:
  # Менялась ли область в этом PR. На merge-коммите PR HEAD^1 — актуальный
  # base, поэтому дифф HEAD^1..HEAD ровно изменения PR. --no-renames: при
  # переносе файла из области учитываем и старый путь, иначе проверки пропустятся.
  changes:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    outputs:
      program: ${{ steps.diff.outputs.program }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "program=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only --no-renames HEAD^1 HEAD | grep -qE '^(program/|\.github/workflows/ci-program\.yml$)'; then
            echo "program=true" >> "$GITHUB_OUTPUT"
          else
            echo "program=false" >> "$GITHUB_OUTPUT"
          fi

  build-test:
    needs: changes
    if: needs.changes.outputs.program == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: program/yarn.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: program
      - name: Установить Solana CLI
        run: |
          sh -c "$(curl -sSfL "https://release.anza.xyz/v${SOLANA_VERSION}/install")"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      # avm собирается из исходников ~2 минуты, поэтому кэшируем его и
      # установленный Anchor; ключ включает версию.
      - name: Кэш avm и Anchor
        id: avm-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/avm
            ~/.cargo/bin/anchor
            ~/.avm
          key: avm-${{ runner.os }}-${{ env.ANCHOR_VERSION }}
      - name: Установить Anchor через avm
        if: steps.avm-cache.outputs.cache-hit != 'true'
        run: |
          cargo install --git https://github.com/solana-foundation/anchor avm --force
          avm install "${ANCHOR_VERSION}"
      - name: Выбрать версию Anchor
        run: |
          avm use "${ANCHOR_VERSION}"
          echo "$HOME/.avm/bin" >> "$GITHUB_PATH"
          anchor --version
      # Одноразовый ключ только для localnet-тестов
      - run: solana-keygen new --no-bip39-passphrase --silent -o ~/.config/solana/id.json
      - run: yarn install --frozen-lockfile
      - run: anchor build
      - run: anchor test --validator legacy

  # Обязательная проверка для main: зелёная, если все нужные job прошли
  # или пропущены, потому что область не менялась.
  program-ok:
    if: always()
    needs: [changes, build-test]
    timeout-minutes: 5
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) exit 1 ;; esac
          done
