name: ci-app

on:
  # На каждом PR: сводная проверка обязательна для мержа в main (MAIN-23),
  # тяжёлые job сами пропускаются, если область не менялась.
  pull_request:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/ci-app.yml"]

concurrency:
  group: ci-app-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

# Минимальные права токена: CI только читает репозиторий.
permissions:
  contents: read

jobs:
  # Менялась ли область в этом PR. На merge-коммите PR HEAD^1 — актуальный
  # base, поэтому дифф HEAD^1..HEAD ровно изменения PR.
  changes:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    outputs:
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only HEAD^1 HEAD | grep -qE '^(app/|\.github/workflows/ci-app\.yml$)'; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

  analyze-test:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test

  build-android:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      # Одна архитектура вместо трёх: для проверки сборки этого достаточно.
      - run: flutter build apk --debug --target-platform android-arm64
      # APK можно скачать из прогона и поставить на телефон для ручной проверки.
      - uses: actions/upload-artifact@v4
        with:
          name: anchorkeep-android-debug
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
          if-no-files-found: error

  build-windows:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    timeout-minutes: 20
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter build windows --debug

  # Обязательная проверка для main: зелёная, если все нужные job прошли
  # или пропущены, потому что область не менялась.
  app-ok:
    if: always()
    needs: [changes, analyze-test, build-android, build-windows]
    timeout-minutes: 5
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) exit 1 ;; esac
          done
