name: ci-app

on:
  pull_request:
    paths: ["app/**", ".github/workflows/ci-app.yml"]
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/ci-app.yml"]

concurrency:
  group: ci-app-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

# Минимальные права токена: CI только читает репозиторий.
permissions:
  contents: read

jobs:
  analyze-test:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test

  build-android:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      # Одна архитектура вместо трёх: для проверки сборки этого достаточно.
      - run: flutter build apk --debug --target-platform android-arm64
      # APK можно скачать из прогона и поставить на телефон для ручной проверки.
      - uses: actions/upload-artifact@v4
        with:
          name: anchorkeep-android-debug
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
          if-no-files-found: error

  build-windows:
    timeout-minutes: 20
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter build windows --debug
